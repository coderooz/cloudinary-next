# Label definitions for coderooz/cloudinary-next
# Synced to GitHub by .github/workflows/labels.yml (action-label-syncer)
# Keep colors as 6-digit hex WITHOUT the leading '#'.

# --- Default GitHub labels (kept in sync) ---
- name: bug
  description: Something isn't working
  color: d73a4a
- name: documentation
  description: Improvements or additions to documentation
  color: 0075ca
- name: duplicate
  description: This issue or pull request already exists
  color: cfd3d7
- name: enhancement
  description: New feature or request
  color: a2eeef
- name: help wanted
  description: Extra attention is needed
  color: 008672
- name: good first issue
  description: Good for newcomers
  color: 7057ff
- name: invalid
  description: This doesn't seem right
  color: e4e669
- name: question
  description: Further information is requested
  color: d876e3
- name: wontfix
  description: This will not be worked on
  color: ffffff

# --- Project-specific labels ---
- name: dependencies
  description: Pull requests that update a dependency file
  color: 0366d6
- name: automated
  description: Automated updates (Dependabot, bots, CI)
  color: fbca04
- name: ci
  description: Changes to CI configuration files and scripts
  color: 1d76db
- name: security
  description: Security-related issues and fixes
  color: b60205
- name: performance
  description: Performance improvements
  color: fbca04
- name: refactor
  description: Code refactoring without behavior change
  color: c5def5
- name: chore
  description: Maintenance tasks
  color: c5def5
- name: breaking change
  description: Changes that break existing behavior
  color: b60205
- name: needs triage
  description: Requires maintainer review and triage
  color: fbca04
- name: stale
  description: Inactive issue or PR marked for closure
  color: cfd3d7
- name: "priority: high"
  description: High priority
  color: b60205
- name: "priority: medium"
  description: Medium priority
  color: fbca04
- name: "priority: low"
  description: Low priority
  color: 0e8a16